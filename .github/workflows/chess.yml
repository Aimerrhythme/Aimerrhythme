name: Chess

on:
  issues:
    types: [opened]

# One move at a time so two issues cannot rewrite the board together.
concurrency:
  group: readme-chess
  cancel-in-progress: false

jobs:
  move:
    permissions:
      issues: write
      contents: write
    runs-on: ubuntu-latest
    if: startsWith(github.event.issue.title, 'Chess:')

    steps:
      - uses: actions/checkout@v4

      - name: Setting up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          architecture: "x64"

      - name: Play chess
        env:
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPOSITORY_OWNER: ${{ github.repository_owner }}
        run: |
          pip install -r requirements.txt
          python main.py

      - name: Commit and push changes
        env:
          ISSUE_TITLE: ${{ github.event.issue.title }}
          ISSUE_AUTHOR: ${{ github.event.issue.user.login }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A README.md data games
          if git diff --staged --quiet; then
            echo "No chess files changed"
            exit 0
          fi
          git commit -m "${ISSUE_TITLE} by ${ISSUE_AUTHOR}"
          git push
